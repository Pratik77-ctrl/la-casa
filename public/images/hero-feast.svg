<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3E1216"/>
      <stop offset="55%" stop-color="#641E24"/>
      <stop offset="100%" stop-color="#242424"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#F28C28" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#641E24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="plate" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="82%" stop-color="#F5E9D6"/>
      <stop offset="100%" stop-color="#E2CEB2"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>
  <!-- Subtle tabletop wood grain lines -->
  <path d="M0 90 Q400 75 800 95" stroke="#FFF8ED" stroke-opacity="0.06" stroke-width="1.5"/>
  <path d="M0 245 Q400 265 800 240" stroke="#FFF8ED" stroke-opacity="0.05" stroke-width="1.5"/>
  <path d="M0 405 Q400 390 800 412" stroke="#FFF8ED" stroke-opacity="0.06" stroke-width="1.5"/>

  <!-- Left Copper Bowl: Paneer Butter Masala -->
  <g transform="translate(185 265)">
    <ellipse cx="0" cy="18" rx="118" ry="118" fill="#180809" fill-opacity="0.38"/>
    <circle cx="0" cy="0" r="112" fill="#B86B35"/>
    <circle cx="0" cy="0" r="102" fill="#D98B4E"/>
    <circle cx="0" cy="0" r="94" fill="#D45724"/>
    <circle cx="-12" cy="-10" r="76" fill="#E3682C" fill-opacity="0.7"/>
    <!-- Paneer cubes -->
    <rect x="-44" y="-32" width="28" height="24" rx="5" transform="rotate(-12 -30 -20)" fill="#FFF8ED"/>
    <rect x="8" y="-44" width="26" height="22" rx="5" transform="rotate(14 21 -33)" fill="#FFF8ED"/>
    <rect x="-14" y="10" width="30" height="25" rx="5" transform="rotate(6 1 22)" fill="#FFF8ED"/>
    <rect x="28" y="4" width="24" height="22" rx="5" transform="rotate(-18 40 15)" fill="#FFF8ED"/>
    <!-- Cream swirl & cilantro -->
    <path d="M-40 0 C-20 -35, 35 -25, 25 12 C18 38, -28 38, -12 8" stroke="#FFF8ED" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.9"/>
    <circle cx="-4" cy="-6" r="6" fill="#2F7D32"/>
    <circle cx="6" cy="-12" r="5" fill="#3B943F"/>
    <circle cx="-10" cy="-14" r="4.5" fill="#46A84A"/>
  </g>

  <!-- Center Hero Pizza -->
  <g transform="translate(430 235)">
    <ellipse cx="8" cy="18" rx="158" ry="158" fill="#150708" fill-opacity="0.42"/>
    <circle cx="0" cy="0" r="150" fill="#D69B56"/>
    <circle cx="0" cy="0" r="130" fill="#E7B36E"/>
    <circle cx="0" cy="0" r="122" fill="#C93D2B"/>
    <circle cx="0" cy="0" r="112" fill="#F9E09C"/>
    <!-- Slice lines -->
    <line x1="0" y1="-122" x2="0" y2="122" stroke="#D69B56" stroke-width="2" opacity="0.5"/>
    <line x1="-122" y1="0" x2="122" y2="0" stroke="#D69B56" stroke-width="2" opacity="0.5"/>
    <line x1="-86" y1="-86" x2="86" y2="86" stroke="#D69B56" stroke-width="2" opacity="0.5"/>
    <line x1="-86" y1="86" x2="86" y2="-86" stroke="#D69B56" stroke-width="2" opacity="0.5"/>
    <!-- Mozzarella & toppings -->
    <circle cx="-46" cy="-42" r="17" fill="#FFFDF7"/>
    <circle cx="48" cy="-36" r="16" fill="#FFFDF7"/>
    <circle cx="-42" cy="48" r="18" fill="#FFFDF7"/>
    <circle cx="44" cy="44" r="16" fill="#FFFDF7"/>
    <circle cx="0" cy="-76" r="14" fill="#FFFDF7"/>
    <circle cx="0" cy="76" r="14" fill="#FFFDF7"/>
    <ellipse cx="-24" cy="-18" rx="10" ry="6" transform="rotate(28 -24 -18)" fill="#2F7D32"/>
    <ellipse cx="32" cy="14" rx="11" ry="6" transform="rotate(-32 32 14)" fill="#2F7D32"/>
    <ellipse cx="-20" cy="36" rx="9" ry="5" transform="rotate(14 -20 36)" fill="#39913C"/>
    <circle cx="22" cy="-58" r="8" fill="#C83E2B"/>
    <circle cx="-68" cy="16" r="8" fill="#C83E2B"/>
    <circle cx="66" cy="-10" r="8" fill="#C83E2B"/>
  </g>

  <!-- Right Top: Hakka Noodles Bowl -->
  <g transform="translate(650 145)">
    <ellipse cx="4" cy="12" rx="95" ry="95" fill="#150708" fill-opacity="0.38"/>
    <circle cx="0" cy="0" r="90" fill="#2A2827"/>
    <circle cx="0" cy="0" r="80" fill="#3B3836"/>
    <path d="M-50 -20 C-15 -45, 25 -45, 52 -15" stroke="#F4C16B" stroke-width="6" stroke-linecap="round"/>
    <path d="M-56 0 C-10 -25, 30 -18, 56 8" stroke="#EAB152" stroke-width="6" stroke-linecap="round"/>
    <path d="M-46 22 C-5 2, 22 6, 48 28" stroke="#F4C16B" stroke-width="6" stroke-linecap="round"/>
    <path d="M-32 42 C0 26, 20 30, 36 44" stroke="#EAB152" stroke-width="5.5" stroke-linecap="round"/>
    <!-- Peppers & scallions -->
    <rect x="-25" y="-26" width="16" height="6" rx="3" transform="rotate(20 -25 -26)" fill="#D93829"/>
    <rect x="12" y="-12" width="18" height="6" rx="3" transform="rotate(-15 12 -12)" fill="#4CAF50"/>
    <rect x="-12" y="18" width="16" height="6" rx="3" transform="rotate(12 -12 18)" fill="#F28C28"/>
    <line x1="25" y1="-72" x2="95" y2="-115" stroke="#D9A86C" stroke-width="5" stroke-linecap="round"/>
    <line x1="38" y1="-58" x2="105" y2="-95" stroke="#C59050" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Bottom Right: Gourmet Burger -->
  <g transform="translate(645 365)">
    <ellipse cx="4" cy="14" rx="96" ry="96" fill="#150708" fill-opacity="0.36"/>
    <circle cx="0" cy="0" r="88" fill="url(#plate)"/>
    <circle cx="0" cy="0" r="54" fill="#E69E45"/>
    <circle cx="0" cy="-4" r="46" fill="#F2AE54"/>
    <ellipse cx="-16" cy="-18" rx="4" ry="2.2" transform="rotate(20 -16 -18)" fill="#FFF8ED"/>
    <ellipse cx="14" cy="-22" rx="4" ry="2.2" transform="rotate(-15 14 -22)" fill="#FFF8ED"/>
    <ellipse cx="22" cy="8" rx="4" ry="2.2" transform="rotate(35 22 8)" fill="#FFF8ED"/>
    <ellipse cx="-18" cy="14" rx="4" ry="2.2" transform="rotate(-25 -18 14)" fill="#FFF8ED"/>
    <ellipse cx="2" cy="2" rx="4" ry="2.2" fill="#FFF8ED"/>
    <!-- Lettuce & cheese peek -->
    <path d="M-54 10 Q-30 34 0 26 Q32 34 54 10" stroke="#4CA64C" stroke-width="8" stroke-linecap="round" fill="none"/>
    <polygon points="-42,18 -18,46 8,24" fill="#FFC83D"/>
  </g>

  <!-- Garlic Naan & Mint Chutney Bottom Left -->
  <g transform="translate(155 110)">
    <circle cx="0" cy="0" r="46" fill="#F2E4CE"/>
    <circle cx="0" cy="0" r="35" fill="#469A4B"/>
    <circle cx="-6" cy="-5" r="14" fill="#5DB662" fill-opacity="0.5"/>
  </g>
</svg>
